services:
  postgres:
    image: postgres:latest
    container_name: security-test-postgres
    restart: "no"
    ports:
      - "5436:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "security_test_db"

volumes:
  pg-data: